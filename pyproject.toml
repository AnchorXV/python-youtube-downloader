[project]
name = "ytdl"
version = "0.1.0"
description = "YouTube Downloader"
requires-python = ">=3.10"

[project.scripts]
ytdl = "ytdl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]